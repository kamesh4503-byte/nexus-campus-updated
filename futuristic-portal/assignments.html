<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Assignments — Nexus Campus</title>
<script src="js/theme.js?v=3.0.0"></script>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="css/style.css?v=3.0.0" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <div class="page-header">
      <div>
        <span class="eyebrow">All subjects</span>
        <h1>Assignments</h1>
      </div>
    </div>

    <div class="card">
      <table>
        <thead><tr><th>Title</th><th>Subject</th><th>Due</th><th>Status</th><th></th></tr></thead>
        <tbody id="assignments-table"><tr><td colspan="5">Loading…</td></tr></tbody>
      </table>
    </div>

    <div class="card" id="submit-panel" style="margin-top:18px; display:none;">
      <span class="label" style="font-family:var(--font-head); color:var(--text-dim); font-size:0.8rem; text-transform:uppercase;">Submit: <span id="submit-title"></span></span>
      <div class="field" style="margin-top:12px;">
        <label for="submit-text">Your answer / notes</label>
        <textarea id="submit-text" rows="4" placeholder="Type or paste your submission…"></textarea>
      </div>
      <button class="btn" id="submit-confirm">Submit assignment</button>
      <button class="btn secondary" id="submit-cancel" style="margin-left:8px;">Cancel</button>
      <div class="error-msg" id="submit-status"></div>
    </div>
  </main>
</div>

<script src="js/auth.js?v=3.0.0"></script>
<script src="js/api.js?v=3.0.0"></script>
<script>
  requireLogin();
  renderSidebar("assignments.html");
  let currentAssignmentId = null;

  async function loadAssignments(){
    const table=document.getElementById("assignments-table");
    try{
      const data=await getAssignments();
      table.innerHTML=data.length?data.map(a=>`<tr><td>${nexusEscape(a.title)}</td><td>${nexusEscape(a.subject)}</td><td>${nexusEscape(a.due_date)}</td><td><span class="pill ${a.status==="submitted"?"submitted":"pending"}">${nexusEscape(a.status)}</span></td><td>${a.status==="submitted"?"":`<button class="btn secondary assignment-submit" type="button" data-id="${nexusEscape(String(a.id))}">Submit</button>`}</td></tr>`).join(""):`<tr><td colspan="5">No assignments.</td></tr>`;
      table.querySelectorAll(".assignment-submit").forEach(btn=>btn.addEventListener("click",()=>{const a=data.find(x=>String(x.id)===btn.dataset.id);if(a)openSubmit(String(a.id),a.title);}));
    }catch(err){table.innerHTML=`<tr><td colspan="5" class="error-msg">${nexusEscape(err.message||"Could not load assignments.")}</td></tr>`;}
  }
  function openSubmit(id,title){currentAssignmentId=id;document.getElementById("submit-title").textContent=title;document.getElementById("submit-text").value="";document.getElementById("submit-status").textContent="";document.getElementById("submit-panel").style.display="block";document.getElementById("submit-panel").scrollIntoView({behavior:"smooth",block:"nearest"});}
  document.getElementById("submit-cancel").addEventListener("click",()=>{document.getElementById("submit-panel").style.display="none";currentAssignmentId=null;});
  document.getElementById("submit-confirm").addEventListener("click",async()=>{const text=document.getElementById("submit-text").value.trim(),status=document.getElementById("submit-status");if(!currentAssignmentId){status.textContent="Choose an assignment first.";return;}if(!text){status.textContent="Write something before submitting.";return;}try{await submitAssignment(currentAssignmentId,text);status.style.color="var(--green)";status.textContent="Submitted.";await loadAssignments();setTimeout(()=>{document.getElementById("submit-panel").style.display="none";},450);}catch(err){status.style.color="var(--red)";status.textContent=err.message||"Submission failed.";}});
  loadAssignments();
</script>
</body>
</html>
