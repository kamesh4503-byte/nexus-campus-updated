<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Attendance — Nexus Campus</title>
<script src="js/theme.js?v=3.0.0"></script>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="css/style.css?v=3.0.0" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <div class="page-header">
      <div>
        <span class="eyebrow">Last 30 days</span>
        <h1>Attendance</h1>
      </div>
    </div>

    <div class="card" style="margin-bottom:20px;">
      <span class="label" style="font-family:var(--font-head); color:var(--text-dim); font-size:0.8rem; text-transform:uppercase; letter-spacing:0.05em;">Overall percentage</span>
      <div class="value" id="att-percent" style="font-family:var(--font-display); font-size:2.2rem; font-weight:700; margin-top:8px;">—</div>
      <div class="punch-card" id="punch-card"></div>
      <div class="punch-legend">
        <span><i style="background:var(--green); box-shadow:0 0 8px var(--green);"></i>Present</span>
        <span><i style="background:var(--red); box-shadow:0 0 8px var(--red);"></i>Absent</span>
      </div>
    </div>

    <div class="card">
      <span class="label" style="font-family:var(--font-head); color:var(--text-dim); font-size:0.8rem; text-transform:uppercase; letter-spacing:0.05em;">Day-by-day record</span>
      <table style="margin-top:10px;">
        <thead><tr><th>Date</th><th>Status</th></tr></thead>
        <tbody id="attendance-table"><tr><td colspan="2">Loading…</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<script src="js/auth.js?v=3.0.0"></script>
<script src="js/api.js?v=3.0.0"></script>
<script>
  requireLogin();renderSidebar("attendance.html");
  async function loadAttendance(){
    try{const data=await getAttendance();const pct=Math.max(0,Math.min(100,Number(data.percentage)||0));document.getElementById("att-percent").textContent=pct+"%";document.getElementById("att-percent").style.color=pct>=75?"var(--green)":"var(--red)";const records=Array.isArray(data.records)?data.records:[];document.getElementById("punch-card").innerHTML=records.map(r=>`<div class="punch-dot ${r.status==="absent"?"absent":"present"}" title="${nexusEscape(r.date)}: ${nexusEscape(r.status)}"></div>`).join("");document.getElementById("attendance-table").innerHTML=records.length?[...records].reverse().map(r=>`<tr><td>${nexusEscape(r.date)}</td><td><span class="pill ${r.status==="absent"?"absent":"present"}">${nexusEscape(r.status)}</span></td></tr>`).join(""):`<tr><td colspan="2">No attendance records.</td></tr>`;}catch(err){document.getElementById("attendance-table").innerHTML=`<tr><td colspan="2" class="error-msg">${nexusEscape(err.message||"Could not load attendance.")}</td></tr>`;}
  }
  loadAttendance();
</script>
</body>
</html>
