<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Student Profile — Nexus Campus</title><script src="js/theme.js?v=3.0.0"></script><link rel="icon" href="favicon.png"><link rel="stylesheet" href="css/style.css?v=3.0.0"></head><body>
<div class="app-shell"><aside class="sidebar" id="sidebar"></aside><main class="main">
<div class="page-header"><div><span class="eyebrow">Digital identity</span><h1>Student Profile</h1></div><span class="pill present">Verified Student</span></div>
<div class="profile-layout">
  <section class="card digital-id" id="digital-id"><div class="id-scanline"></div><div class="id-top"><div class="avatar-orb" id="profile-avatar">N</div><div><span class="eyebrow">Nexus Campus ID</span><h2 id="profile-name">Loading…</h2><p class="subtext" id="profile-roll">—</p></div></div><div class="id-grid" id="id-grid"></div><div class="id-code"><span>NEXUS://STUDENT</span><div class="barcode"></div></div></section>
  <section class="card"><span class="eyebrow">Academic Snapshot</span><h2 style="margin-bottom:18px">Current status</h2><div class="profile-stat-grid" id="profile-stats"><div class="profile-stat"><b>—</b><span>Attendance</span></div><div class="profile-stat"><b>—</b><span>Pending</span></div><div class="profile-stat"><b>—</b><span>Events</span></div></div><div class="bio-panel"><span class="label">PROFILE NOTE</span><p id="profile-bio">—</p></div><a href="chatbot.html" class="btn" style="display:inline-block;margin-top:18px">Ask Nexus AI about my day →</a></section>
</div>
</main></div>
<script src="js/auth.js?v=3.0.0"></script><script src="js/api.js?v=3.0.0"></script><script>
requireLogin(); renderSidebar("profile.html");
(async()=>{try{const [p,a,as,e]=await Promise.all([getProfile(),getAttendance(),getAssignments(),getCampusEvents()]);const session=getStudentInfo(),displayName=(p.name==="Test Student"&&session.name!=="Student")?session.name:(p.name||session.name),displayRoll=(p.roll_no||session.roll_no||"—");document.getElementById("profile-avatar").textContent=(p.avatar||displayName||"N").slice(0,2).toUpperCase();document.getElementById("profile-name").textContent=displayName;document.getElementById("profile-roll").textContent=`ROLL NO · ${displayRoll}`;document.getElementById("id-grid").innerHTML=`<div><span>Department</span><b>${nexusEscape(p.department||'—')}</b></div><div><span>Semester</span><b>${nexusEscape(p.semester||'—')}</b></div><div><span>Section</span><b>${nexusEscape(p.section||'—')}</b></div><div><span>Email</span><b>${nexusEscape(p.email||'—')}</b></div>`;document.getElementById("profile-bio").textContent=p.bio||"No profile note yet.";document.getElementById("profile-stats").innerHTML=`<div class="profile-stat"><b>${a.percentage}%</b><span>Attendance</span></div><div class="profile-stat"><b>${as.filter(x=>x.status!=='submitted').length}</b><span>Pending</span></div><div class="profile-stat"><b>${e.length}</b><span>Events</span></div>`;}catch(err){document.getElementById("profile-name").textContent="Student Profile";}})();
</script></body></html>
