<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Dashboard — Nexus Campus</title><script src="js/theme.js"></script><link rel="icon" href="favicon.png"><link rel="stylesheet" href="css/style.css"></head><body>
<div class="app-shell"><aside class="sidebar" id="sidebar"></aside><main class="main">
<div class="page-header"><div><span class="eyebrow">Overview</span><h1>Dashboard</h1></div><button class="btn secondary compact" onclick="document.getElementById('command-open')?.click()">⌘ Search Nexus</button></div>
<div class="grid cols-4" id="summary-cards"><div class="card metric-card"><span class="label">Loading…</span></div></div>
<div class="grid cols-2" style="margin-top:18px">
 <div class="card"><span class="section-label">Attendance ring</span><div class="ring-wrap" style="margin-top:14px"><svg width="120" height="120" viewBox="0 0 120 120"><circle class="ring-bg" cx="60" cy="60" r="52" stroke-width="10"></circle><circle class="ring-fg" id="ring-fg" cx="60" cy="60" r="52" stroke-width="10" stroke="url(#ringGrad)"></circle><defs><linearGradient id="ringGrad"><stop offset="0%" stop-color="#00E5FF"/><stop offset="100%" stop-color="#FF3EC9"/></linearGradient></defs></svg><div><div class="ring-label" id="ring-label">—%</div><div class="subtext">current attendance</div></div></div></div>
 <div class="card ai-dashboard-card"><div class="ai-dashboard-orb">✦</div><div><span class="section-label">Nexus AI Copilot</span><p class="subtext" style="margin:10px 0 16px">Ask about your schedule, deadlines, attendance, campus notices, or study topics.</p><a href="chatbot.html" class="btn secondary">Open Copilot →</a></div></div>
</div>
<div class="grid cols-2" style="margin-top:18px;align-items:start">
 <section class="card"><div class="card-head-row"><div><span class="eyebrow">Campus feed</span><h2>Latest announcements</h2></div><a href="announcements.html" class="text-link">View all →</a></div><div id="dashboard-announcements" class="compact-feed"><p class="subtext">Loading…</p></div></section>
 <section class="card"><div class="card-head-row"><div><span class="eyebrow">Coming up</span><h2>Smart calendar</h2></div><a href="calendar.html" class="text-link">Open calendar →</a></div><div id="dashboard-events" class="compact-feed"><p class="subtext">Loading…</p></div></section>
</div>
</main></div>
<script src="js/auth.js"></script><script src="js/api.js"></script><script>
requireLogin();renderSidebar("dashboard.html");function animateCount(el,target,suffix=""){let cur=0,step=Math.max(1,Math.round(target/30));(function tick(){cur=Math.min(target,cur+step);el.textContent=cur+suffix;if(cur<target)requestAnimationFrame(tick);})();}
(async()=>{const [attendance,assignments,timetable,announcements,events]=await Promise.all([getAttendance(),getAssignments(),getTimetable(),getAnnouncements(),getCampusEvents()]);const pending=assignments.filter(a=>a.status!=="submitted").length,dayNames=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],todayName=dayNames[new Date().getDay()],todayIndex=timetable.days.indexOf(todayName),classes=todayIndex>=0?timetable.grid[todayIndex].filter(x=>x!=="Lunch").length:0;document.getElementById("summary-cards").innerHTML=`<div class="card metric-card cyan"><div class="glow-icon">📊</div><div class="label">Attendance</div><div class="value" id="v-attendance">0%</div><div class="note">${attendance.percentage>=75?"Above requirement":"Needs attention"}</div></div><div class="card metric-card magenta"><div class="glow-icon">📝</div><div class="label">Pending Tasks</div><div class="value" id="v-pending">0</div><div class="note">assignments to finish</div></div><div class="card metric-card purple"><div class="glow-icon">🕐</div><div class="label">Classes Today</div><div class="value" id="v-classes">0</div><div class="note">${todayIndex>=0?nexusEscape(timetable.grid[todayIndex].find(x=>x!=="Lunch")||"—"):"No regular classes"}</div></div><div class="card metric-card green"><div class="glow-icon">🔔</div><div class="label">Campus Signals</div><div class="value" id="v-signals">0</div><div class="note">announcements & events</div></div>`;animateCount(document.getElementById("v-attendance"),attendance.percentage,"%");animateCount(document.getElementById("v-pending"),pending);animateCount(document.getElementById("v-classes"),classes);animateCount(document.getElementById("v-signals"),announcements.length+events.length);const r=52,c=2*Math.PI*r,ring=document.getElementById("ring-fg");ring.style.strokeDasharray=c;ring.style.strokeDashoffset=c;requestAnimationFrame(()=>ring.style.strokeDashoffset=c-(attendance.percentage/100)*c);animateCount(document.getElementById("ring-label"),attendance.percentage,"%");document.getElementById("dashboard-announcements").innerHTML=announcements.slice(0,3).map(n=>`<a href="announcements.html" class="compact-row"><span class="feed-icon ${n.level||'info'}">◈</span><span><b>${nexusEscape(n.title)}</b><small>${nexusEscape(n.body)}</small></span></a>`).join("")||`<p class="subtext">No announcements.</p>`;document.getElementById("dashboard-events").innerHTML=events.slice(0,4).map(e=>`<a href="calendar.html" class="compact-row"><span class="feed-icon ${e.type==='exam'?'urgent':'event'}">${e.type==='exam'?'!':'◇'}</span><span><b>${nexusEscape(e.title)}</b><small>${nexusEscape(e.date)} · ${nexusEscape(e.time||'')} ${nexusEscape(e.location||'')}</small></span></a>`).join("")||`<p class="subtext">No upcoming campus events.</p>`;})();
</script></body></html>
