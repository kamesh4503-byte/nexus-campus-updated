<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Timetable — Nexus Campus</title>
<script src="js/theme.js"></script>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="css/style.css?v=2.2" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <div class="page-header">
      <div>
        <span class="eyebrow">This week</span>
        <h1>Timetable</h1>
      </div>
    </div>

    <div class="card timetable-grid">
      <table id="timetable-table"><tbody><tr><td>Loading…</td></tr></tbody></table>
    </div>
  </main>
</div>

<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script>
  requireLogin();
  renderSidebar("timetable.html");

  const CHIP_COLORS = [
    { bg: "rgba(0,229,255,0.14)", fg: "var(--cyan)" },
    { bg: "rgba(255,62,201,0.14)", fg: "var(--magenta)" },
    { bg: "rgba(139,92,246,0.14)", fg: "var(--purple)" },
    { bg: "rgba(57,255,136,0.14)", fg: "var(--green)" },
    { bg: "rgba(255,209,102,0.14)", fg: "var(--yellow)" }
  ];
  function colorFor(subject){
    let hash = 0;
    for (let i = 0; i < subject.length; i++) hash = subject.charCodeAt(i) + ((hash << 5) - hash);
    return CHIP_COLORS[Math.abs(hash) % CHIP_COLORS.length];
  }

  async function loadTimetable(){
    const data = await getTimetable();
    const headerRow = `<tr><th>Time</th>${data.days.map(d => `<th>${d}</th>`).join("")}</tr>`;
    const bodyRows = data.periods.map((period, pIdx) => `
      <tr>
        <td>${period}</td>
        ${data.days.map((_, dIdx) => {
          const subject = data.grid[dIdx][pIdx];
          if (subject === "Lunch") return `<td style="color:var(--text-dim)">${subject}</td>`;
          const c = colorFor(subject);
          return `<td><span class="subject-chip" style="background:${c.bg}; color:${c.fg}">${subject}</span></td>`;
        }).join("")}
      </tr>
    `).join("");
    document.getElementById("timetable-table").innerHTML = `<thead>${headerRow}</thead><tbody>${bodyRows}</tbody>`;
  }

  loadTimetable();
</script>
</body>
</html>
