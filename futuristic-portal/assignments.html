<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Assignments — Nexus Campus</title>
<script src="js/theme.js"></script>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <div class="page-header">
      <div>
        <span class="eyebrow">All subjects</span>
        <h1>Assignments</h1>
      </div>
    </div>

    <div class="card">
      <table>
        <thead><tr><th>Title</th><th>Subject</th><th>Due</th><th>Status</th><th></th></tr></thead>
        <tbody id="assignments-table"><tr><td colspan="5">Loading…</td></tr></tbody>
      </table>
    </div>

    <div class="card" id="submit-panel" style="margin-top:18px; display:none;">
      <span class="label" style="font-family:var(--font-head); color:var(--text-dim); font-size:0.8rem; text-transform:uppercase;">Submit: <span id="submit-title"></span></span>
      <div class="field" style="margin-top:12px;">
        <label for="submit-text">Your answer / notes</label>
        <textarea id="submit-text" rows="4" placeholder="Type or paste your submission…"></textarea>
      </div>
      <button class="btn" id="submit-confirm">Submit assignment</button>
      <button class="btn secondary" id="submit-cancel" style="margin-left:8px;">Cancel</button>
      <div class="error-msg" id="submit-status"></div>
    </div>
  </main>
</div>

<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script>
  requireLogin();
  renderSidebar("assignments.html");

  let currentAssignmentId = null;

  async function loadAssignments(){
    const data = await getAssignments();
    document.getElementById("assignments-table").innerHTML = data.map(a => `
      <tr>
        <td>${a.title}</td>
        <td>${a.subject}</td>
        <td>${a.due_date}</td>
        <td><span class="pill ${a.status}">${a.status}</span></td>
        <td>${a.status === "submitted" ? "" :
          `<button class="btn secondary" onclick='openSubmit(${JSON.stringify(String(a.id))}, ${JSON.stringify(a.title)})'>Submit</button>`}</td>
      </tr>
    `).join("");
  }

  function openSubmit(id, title){
    currentAssignmentId = id;
    document.getElementById("submit-title").textContent = title;
    document.getElementById("submit-text").value = "";
    document.getElementById("submit-status").textContent = "";
    document.getElementById("submit-panel").style.display = "block";
    document.getElementById("submit-panel").scrollIntoView({ behavior: "smooth" });
  }

  document.getElementById("submit-cancel").addEventListener("click", () => {
    document.getElementById("submit-panel").style.display = "none";
  });

  document.getElementById("submit-confirm").addEventListener("click", async () => {
    const text = document.getElementById("submit-text").value.trim();
    const statusEl = document.getElementById("submit-status");
    if (!text) { statusEl.textContent = "Write something before submitting."; return; }
    try {
      await submitAssignment(currentAssignmentId, text);
      document.getElementById("submit-panel").style.display = "none";
      loadAssignments();
    } catch (err) {
      statusEl.textContent = err.message || "Submission failed.";
    }
  });

  loadAssignments();
</script>
</body>
</html>
