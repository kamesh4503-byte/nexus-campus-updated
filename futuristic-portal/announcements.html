<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Announcements — Nexus Campus</title><script src="js/theme.js"></script><link rel="icon" href="favicon.png"><link rel="stylesheet" href="css/style.css?v=2.2"></head><body>
<div class="app-shell"><aside class="sidebar" id="sidebar"></aside><main class="main">
<div class="page-header"><div><span class="eyebrow">Campus signal feed</span><h1>Announcements</h1></div><span class="live-badge"><span class="dot"></span>LIVE UPDATES</span></div>
<div class="announcement-hero card"><div><span class="eyebrow">Nexus Broadcast</span><h2>Everything important, in one feed.</h2><p class="subtext">Notices posted from the admin control center appear here and in your notification panel automatically.</p></div><div class="signal-visual"><span></span><span></span><span></span></div></div>
<div id="announcement-feed" class="announcement-feed"><div class="card"><p class="subtext">Loading campus feed…</p></div></div>
</main></div>
<script src="js/auth.js"></script><script src="js/api.js"></script><script>
requireLogin(); renderSidebar("announcements.html");
(async()=>{const feed=document.getElementById("announcement-feed");try{const items=await getAnnouncements();feed.innerHTML=items.length?items.map(n=>`<article class="card announcement-card ${n.level||'info'}"><div class="announcement-meta"><span class="announcement-level">${nexusEscape((n.level||'info').toUpperCase())}</span><span>${nexusEscape(n.date||'')}</span></div><h2>${nexusEscape(n.title)}</h2><p>${nexusEscape(n.body)}</p></article>`).join(""):`<div class="card"><p class="subtext">No campus announcements yet.</p></div>`;}catch(e){feed.innerHTML=`<div class="card"><p class="subtext">Could not load announcements.</p></div>`;}})();
</script></body></html>
