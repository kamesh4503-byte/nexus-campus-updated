<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Smart Calendar — Nexus Campus</title><script src="js/theme.js"></script><link rel="icon" href="favicon.png"><link rel="stylesheet" href="css/style.css?v=2.2"></head><body>
<div class="app-shell"><aside class="sidebar" id="sidebar"></aside><main class="main">
<div class="page-header"><div><span class="eyebrow">Classes + assignments + exams + events</span><h1>Smart Calendar</h1></div><span class="pill present">UNIFIED VIEW</span></div>
<div class="calendar-summary grid cols-3" id="calendar-summary" style="margin-bottom:18px"><div class="card metric-card"><div class="label">Loading</div></div></div>
<div class="card" style="margin-bottom:18px"><div class="calendar-header"><button class="calendar-nav-btn" id="cal-prev">‹</button><div class="calendar-month-label" id="cal-month-label">—</div><button class="calendar-nav-btn" id="cal-next">›</button></div><div class="calendar-weekdays"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div><div class="calendar-grid" id="calendar-grid"></div><div class="punch-legend smart-legend"><span><i style="background:var(--cyan)"></i>Class</span><span><i style="background:var(--yellow)"></i>Assignment</span><span><i style="background:var(--red)"></i>Exam</span><span><i style="background:var(--green)"></i>Campus event</span><span><i style="background:var(--purple)"></i>Personal reminder</span></div></div>
<div class="card"><span class="section-label" id="selected-day-label">Select a day</span><div id="selected-day-events" style="margin-top:14px"></div><div class="calendar-add-row"><input id="reminder-input" placeholder="Add a personal study reminder…"><button class="btn" id="reminder-add-btn">Add</button></div><p class="subtext" style="margin-top:10px">Personal reminders stay only in this browser. Admin-created campus events sync for everyone.</p></div>
</main></div>
<script src="js/auth.js"></script><script src="js/api.js"></script><script>
requireLogin();renderSidebar("calendar.html");const REMINDERS_KEY="nexus_calendar_reminders";const loadReminders=()=>{try{return JSON.parse(localStorage.getItem(REMINDERS_KEY))||{};}catch{return {};}};const saveReminders=x=>localStorage.setItem(REMINDERS_KEY,JSON.stringify(x));const toKey=(y,m,d)=>`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;const today=new Date();let viewYear=today.getFullYear(),viewMonth=today.getMonth(),selectedKey=toKey(today.getFullYear(),today.getMonth(),today.getDate()),assignments=[],events=[],timetable=null;const monthNames=["January","February","March","April","May","June","July","August","September","October","November","December"];
function dayData(key){const [y,m,d]=key.split("-").map(Number),date=new Date(y,m-1,d),abbr=date.toLocaleDateString("en-US",{weekday:"short"});const out=[];(assignments||[]).filter(a=>a.status!=="submitted"&&a.due_date===key).forEach(a=>out.push({type:"assignment",color:"var(--yellow)",title:a.title,meta:`Due · ${a.subject}`}));(events||[]).filter(e=>e.date===key).forEach(e=>out.push({type:e.type,color:e.type==="exam"?"var(--red)":"var(--green)",title:e.title,meta:`${e.time||""} ${e.location||""}`.trim()}));const rem=loadReminders()[key]||[];rem.forEach(r=>out.push({type:"reminder",color:"var(--purple)",title:r.title,meta:"Personal",id:r.id}));if(timetable&&timetable.days.includes(abbr)){const idx=timetable.days.indexOf(abbr);timetable.periods.forEach((time,i)=>{const subject=timetable.grid[idx][i];if(subject!=="Lunch")out.push({type:"class",color:"var(--cyan)",title:subject,meta:`Class · ${time}`});});}return out;}
function renderCalendar(){document.getElementById("cal-month-label").textContent=`${monthNames[viewMonth]} ${viewYear}`;const first=new Date(viewYear,viewMonth,1),start=first.getDay(),days=new Date(viewYear,viewMonth+1,0).getDate(),prev=new Date(viewYear,viewMonth,0).getDate(),cells=[];for(let i=start-1;i>=0;i--)cells.push({day:prev-i,other:true});for(let d=1;d<=days;d++)cells.push({day:d,other:false});while(cells.length%7)cells.push({day:cells.length-(start+days)+1,other:true});const todayKey=toKey(today.getFullYear(),today.getMonth(),today.getDate());document.getElementById("calendar-grid").innerHTML=cells.map(c=>{const key=toKey(viewYear,viewMonth,c.day),items=c.other?[]:dayData(key),classes=["calendar-day",c.other?"other-month":"",!c.other&&key===todayKey?"today":"",!c.other&&key===selectedKey?"selected":""].filter(Boolean).join(" ");return`<div class="${classes}" ${c.other?"":`onclick="selectDay('${key}')"`}><div class="day-num">${c.day}</div><div class="day-dots">${[...new Set(items.map(i=>i.color))].slice(0,5).map(color=>`<i style="background:${color};color:${color}"></i>`).join("")}</div>${items.length?`<small class="day-count">${items.length}</small>`:""}</div>`;}).join("");}
function selectDay(k){selectedKey=k;renderCalendar();renderSelected();}
function renderSelected(){const [y,m,d]=selectedKey.split("-").map(Number),date=new Date(y,m-1,d),items=dayData(selectedKey);document.getElementById("selected-day-label").textContent=date.toLocaleDateString([],{weekday:"long",month:"long",day:"numeric",year:"numeric"});document.getElementById("selected-day-events").innerHTML=items.length?items.map(i=>`<div class="calendar-event-row"><span class="event-dot" style="background:${i.color};color:${i.color}"></span><span class="event-title"><b>${nexusEscape(i.title)}</b><small>${nexusEscape(i.meta)}</small></span>${i.type==="reminder"?`<button class="event-remove" onclick="removeReminder('${selectedKey}','${i.id}')">✕</button>`:""}</div>`).join(""):`<p class="subtext">Nothing scheduled for this day.</p>`;}
function addReminder(){const v=document.getElementById("reminder-input").value.trim();if(!v)return;const r=loadReminders();(r[selectedKey]??=[]).push({id:Date.now().toString(36),title:v});saveReminders(r);document.getElementById("reminder-input").value="";renderCalendar();renderSelected();}function removeReminder(k,id){const r=loadReminders();r[k]=(r[k]||[]).filter(x=>x.id!==id);saveReminders(r);renderCalendar();renderSelected();}
document.getElementById("reminder-add-btn").onclick=addReminder;document.getElementById("reminder-input").onkeydown=e=>{if(e.key==="Enter")addReminder();};document.getElementById("cal-prev").onclick=()=>{if(--viewMonth<0){viewMonth=11;viewYear--;}renderCalendar();};document.getElementById("cal-next").onclick=()=>{if(++viewMonth>11){viewMonth=0;viewYear++;}renderCalendar();};
(async()=>{[assignments,events,timetable]=await Promise.all([getAssignments(),getCampusEvents(),getTimetable()]);const upcomingAssignments=assignments.filter(a=>a.status!=="submitted").length;const upcomingEvents=events.filter(e=>new Date(e.date+"T23:59:00")>=today).length;const thisWeek=[...Array(7)].reduce((n,_,i)=>{const d=new Date(today);d.setDate(today.getDate()+i);return n+dayData(toKey(d.getFullYear(),d.getMonth(),d.getDate())).filter(x=>x.type!=="class").length;},0);document.getElementById("calendar-summary").innerHTML=`<div class="card metric-card cyan"><div class="glow-icon">◇</div><div class="label">This Week</div><div class="value">${thisWeek}</div><div class="note">deadlines & events</div></div><div class="card metric-card yellow"><div class="glow-icon">✓</div><div class="label">Pending</div><div class="value">${upcomingAssignments}</div><div class="note">assignments</div></div><div class="card metric-card green"><div class="glow-icon">◈</div><div class="label">Campus Events</div><div class="value">${upcomingEvents}</div><div class="note">upcoming</div></div>`;renderCalendar();renderSelected();})();
</script></body></html>
