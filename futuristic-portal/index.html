<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nexus Campus — Sign In</title>
<script src="js/theme.js"></script>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="css/style.css?v=2.2" />
</head>
<body>
<div class="nexus-boot" id="nexus-boot"><div class="boot-inner"><div class="boot-mark">N</div><div class="boot-title">INITIALIZING NEXUS CAMPUS</div><div class="boot-track"><span></span></div><div class="boot-status" id="boot-status">AUTHENTICATING SYSTEM MODULES…</div></div></div>

<div class="login-page">
  <button class="theme-toggle-btn fixed-corner" title="Toggle theme"></button>
  <canvas id="login-canvas"></canvas>
  <div class="login-grid-layer" id="login-grid-layer"></div>
  <div class="blob-layer blob-cyan" id="blob-cyan"><div class="blob-inner"></div></div>
  <div class="blob-layer blob-magenta" id="blob-magenta"><div class="blob-inner"></div></div>

  <div class="login-center">
    <div class="login-logo" id="login-logo"><span>N</span></div>

    <div class="login-brand">
      <h1>NEXUS CAMPUS</h1>
      <div class="login-typed" id="login-typed"><span class="login-cursor"></span></div>
    </div>

    <div class="login-card">
      <div class="disclosure">
        ⚠ Test environment — any username/password signs you in. We only record that a login happened (timestamp + count), never your credentials. Please don't enter a real password.
      </div>

      <form id="login-form">
        <div class="field">
          <label for="username">Username / Roll No</label>
          <input type="text" id="username" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn">Enter Portal</button>
        <div class="error-msg" id="error-msg"></div>
      </form>
    </div>

    <div class="feature-pills">
      <span><i></i>Attendance</span>
      <span><i></i>Assignments</span>
      <span><i></i>Timetable</span>
      <span><i></i>AI Assistant</span>
    </div>
  </div>
</div>

<script src="js/api.js?v=2.3"></script>
<script src="js/login-fx.js"></script>
<script>
  const boot = document.getElementById("nexus-boot");
  const bootStatus = document.getElementById("boot-status");
  setTimeout(() => { if (bootStatus) bootStatus.textContent = "CAMPUS SYSTEM ONLINE"; }, 850);
  setTimeout(() => { if (boot) boot.classList.add("done"); }, 1500);

  if (window.NexusTheme) {
    window.NexusTheme.wireButton(document.querySelector(".theme-toggle-btn"));
  }

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const errorEl = document.getElementById("error-msg");
    errorEl.textContent = "";

    try {
      // Call the backend directly so sign-in does not depend on api.js loading.
      // This also avoids stale browser-cache problems after a Render redeploy.
      if (window.location.protocol === "file:") {
        throw new Error("Start Nexus Campus with server.py, then open http://localhost:5500");
      }

      const response = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });

      const result = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(result.error || result.detail || `Login failed (${response.status})`);
      }

      localStorage.setItem("nexus_token", result.token || "test-session-token");
      localStorage.setItem("nexus_name", result.name || username || "Student");
      localStorage.setItem("nexus_roll", result.roll_no || "TEST-000");
      window.location.href = "dashboard.html";
    } catch (err) {
      console.error("Nexus login error:", err);
      errorEl.textContent = err.message || "Login failed. Please try again.";
    }
  });
</script>
</body>
</html>
